<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nasara Plaza Morning Training</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #ffffff;
      --subtext: #a0a0a0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 40px;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h2 { margin: 0; color: var(--accent); font-size: 20px; }
    .btn-reset {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .controls-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: var(--card);
      color: #fff;
      font-size: 16px;
    }
    select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: var(--card);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-add {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(var(--team-cols, 3), 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }
    .team-card {
      background: var(--card);
      border-radius: 8px;
      padding: 10px;
      border-top: 4px solid var(--accent);
    }
    .team-card.team-A { border-top-color: #10b981; }
    .team-card.team-B { border-top-color: #3b82f6; }
    .team-card.team-C { border-top-color: #f59e0b; }
    .team-card.team-D { border-top-color: #ec4899; }
    .team-card h3 { margin: 0 0 10px 0; font-size: 13px; text-transform: uppercase; text-align: center; }
    .player-slot {
      padding: 6px 0;
      border-bottom: 1px solid #2a2a2a;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }
    .player-slot span { color: var(--subtext); font-size: 10px; }
    
    /* 6-Player Divider Styling */
    .team-divider {
      margin: 8px 0;
      padding: 4px 0;
      border-top: 2px dashed #f59e0b;
      border-bottom: 2px dashed #f59e0b;
      text-align: center;
      font-size: 9px;
      font-weight: bold;
      color: #f59e0b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(245, 158, 11, 0.08);
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 8px;
      text-align: left;
      font-size: 13px;
      border-bottom: 1px solid #2a2a2a;
    }
    th { background: #252525; color: var(--subtext); }
    .action-btns {
      display: flex;
      gap: 6px;
    }
    .btn-action {
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
    }
  </style>
</head>
<body>

  <div class="header-row">
    <h2>Nasara Plaza Match Manager</h2>
    <button class="btn-reset" onclick="resetSession()">Reset All</button>
  </div>

  <!-- Entry & Controls Form -->
  <div class="controls-group">
    <input type="text" id="playerName" placeholder="Enter player name..." autocomplete="off">
    <select id="teamCountSelect" onchange="changeTeamCount()">
      <option value="2">2 Teams</option>
      <option value="3" selected>3 Teams</option>
      <option value="4">4 Teams</option>
    </select>
    <button class="btn-add" id="submitBtn" onclick="addOrUpdatePlayer()">Add</button>
  </div>

  <!-- Teams Output -->
  <h3 style="font-size: 14px; color: var(--subtext);">TEAMS</h3>
  <div class="teams-grid" id="teamsGrid"></div>

  <!-- Arrival Log -->
  <h3 style="font-size: 14px; color: var(--subtext);">ARRIVAL LIST</h3>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Time</th>
        <th style="text-align: right;">Action</th>
      </tr>
    </thead>
    <tbody id="arrivalTable"></tbody>
  </table>

  <script>
    let players = JSON.parse(localStorage.getItem('soccer_players') || '[]');
    let numTeams = parseInt(localStorage.getItem('soccer_num_teams') || '3');
    let editPlayerId = null;

    document.getElementById('teamCountSelect').value = numTeams;

    function getTeamKeys(count = numTeams) {
      const keys = ['A', 'B', 'C', 'D'];
      return keys.slice(0, count);
    }

    function changeTeamCount() {
      numTeams = parseInt(document.getElementById('teamCountSelect').value);
      localStorage.setItem('soccer_num_teams', numTeams);
      
      assignTeamsToUnassigned();
      saveAndRender();
    }

    function addOrUpdatePlayer() {
      const input = document.getElementById('playerName');
      const name = input.value.trim();
      if (!name) return;

      if (editPlayerId !== null) {
        const player = players.find(p => p.id === editPlayerId);
        if (player) player.name = name;
        editPlayerId = null;
        document.getElementById('submitBtn').innerText = 'Add';
      } else {
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const newPlayer = {
          id: players.length + 1,
          name: name,
          time: timeStr,
          teamsMap: {} // Stores fixed assignments: { '2': 'A', '3': 'C', '4': 'B' }
        };
        players.push(newPlayer);
      }

      assignTeamsToUnassigned();
      saveAndRender();
      input.value = '';
    }

    function editPlayer(id) {
      const player = players.find(p => p.id === id);
      if (!player) return;

      document.getElementById('playerName').value = player.name;
      document.getElementById('playerName').focus();
      document.getElementById('submitBtn').innerText = 'Save';
      editPlayerId = id;
    }

    function deletePlayer(id) {
      if (!confirm("Are you sure you want to remove this player?")) return;
      
      players = players.filter(p => p.id !== id);

      // Re-index IDs while keeping assignments intact
      players.forEach((p, idx) => {
        p.id = idx + 1;
      });

      saveAndRender();
    }

    function resetSession() {
      if (confirm("Reset the entire session list and all team assignments? This cannot be undone.")) {
        players = [];
        localStorage.removeItem('soccer_players');
        saveAndRender();
      }
    }

    // Ensures each player has a permanent assigned team for 2-team, 3-team, and 4-team modes
    function assignTeamsToUnassigned() {
      [2, 3, 4].forEach(modeCount => {
        const activeTeams = getTeamKeys(modeCount);
        const unassigned = players.filter(p => !p.teamsMap || !p.teamsMap[modeCount]);

        if (unassigned.length === 0) return;

        // Count current distribution for this mode
        const teamCounts = {};
        activeTeams.forEach(t => teamCounts[t] = 0);
        players.forEach(p => {
          if (p.teamsMap && p.teamsMap[modeCount]) {
            teamCounts[p.teamsMap[modeCount]]++;
          }
        });

        // Assign unassigned players deterministically to balance teams without re-shuffling existing members
        unassigned.forEach(player => {
          if (!player.teamsMap) player.teamsMap = {};

          let minCount = Math.min(...Object.values(teamCounts));
          let candidateTeams = activeTeams.filter(t => teamCounts[t] === minCount);

          // Pick randomly among tied smallest teams
          let chosenTeam = candidateTeams[Math.floor(Math.random() * candidateTeams.length)];
          player.teamsMap[modeCount] = chosenTeam;
          teamCounts[chosenTeam]++;
        });
      });
    }

    function saveAndRender() {
      localStorage.setItem('soccer_players', JSON.stringify(players));

      // Render Arrival List
      const tbody = document.getElementById('arrivalTable');
      tbody.innerHTML = players.map(p => `
        <tr>
          <td>${p.id}</td>
          <td><strong>${p.name}</strong></td>
          <td>${p.time}</td>
          <td style="text-align: right;">
            <div class="action-btns" style="justify-content: flex-end;">
              <button class="btn-action" onclick="editPlayer(${p.id})">✏️</button>
              <button class="btn-action" onclick="deletePlayer(${p.id})">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');

      // Dynamic Grid Layout based on current team selection
      const activeTeams = getTeamKeys();
      const teamsGrid = document.getElementById('teamsGrid');
      teamsGrid.style.setProperty('--team-cols', numTeams);

      let gridHtml = '';
      activeTeams.forEach(team => {
        gridHtml += `
          <div class="team-card team-${team}">
            <h3>Team ${team}</h3>
            <div id="team${team}"></div>
          </div>
        `;
      });
      teamsGrid.innerHTML = gridHtml;

      // Render Teams using cached team mode map
      activeTeams.forEach(team => {
        const container = document.getElementById(`team${team}`);
        const teamPlayers = players.filter(p => p.teamsMap && p.teamsMap[numTeams] === team);
        
        let html = '';
        teamPlayers.forEach((p, idx) => {
          html += `
            <div class="player-slot">
              <span>${p.name}</span>
              <span>#${p.id}</span>
            </div>
          `;
          
          // Divider after 6 players
          if ((idx + 1) % 6 === 0 && idx < teamPlayers.length - 1) {
            html += `<div class="team-divider"> Team Limit (6 Players) </div>`;
          }
        });

        container.innerHTML = html;
      });
    }

    // Initial check and render
    assignTeamsToUnassigned();
    saveAndRender();
  </script>
</body>
</html>
