<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nasara Plaza Morning Training</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #ffffff;
      --subtext: #a0a0a0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 40px;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h2 { margin: 0; color: var(--accent); font-size: 20px; }
    .btn-reset {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: var(--card);
      color: #fff;
      font-size: 16px;
    }
    .btn-add {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }
    .team-card {
      background: var(--card);
      border-radius: 8px;
      padding: 10px;
      border-top: 4px solid var(--accent);
    }
    .team-card.b { border-top-color: #3b82f6; }
    .team-card.c { border-top-color: #f59e0b; }
    .team-card h3 { margin: 0 0 10px 0; font-size: 13px; text-transform: uppercase; text-align: center; }
    .player-slot {
      padding: 6px 0;
      border-bottom: 1px solid #2a2a2a;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }
    .player-slot span { color: var(--subtext); font-size: 10px; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 8px;
      text-align: left;
      font-size: 13px;
      border-bottom: 1px solid #2a2a2a;
    }
    th { background: #252525; color: var(--subtext); }
    .action-btns {
      display: flex;
      gap: 6px;
    }
    .btn-action {
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
    }
  </style>
</head>
<body>

  <div class="header-row">
    <h2>Soccer Match Manager</h2>
    <button class="btn-reset" onclick="resetSession()">Reset All</button>
  </div>

  <!-- Entry Form -->
  <div class="input-group">
    <input type="text" id="playerName" placeholder="Enter player name..." autocomplete="off">
    <button class="btn-add" id="submitBtn" onclick="addOrUpdatePlayer()">Add</button>
  </div>

  <!-- Teams Output -->
  <h3 style="font-size: 14px; color: var(--subtext);">TEAMS</h3>
  <div class="teams-grid">
    <div class="team-card a">
      <h3>Team A</h3>
      <div id="teamA"></div>
    </div>
    <div class="team-card b">
      <h3>Team B</h3>
      <div id="teamB"></div>
    </div>
    <div class="team-card c">
      <h3>Team C</h3>
      <div id="teamC"></div>
    </div>
  </div>

  <!-- Arrival Log -->
  <h3 style="font-size: 14px; color: var(--subtext);">ARRIVAL LIST</h3>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Time</th>
        <th style="text-align: right;">Action</th>
      </tr>
    </thead>
    <tbody id="arrivalTable"></tbody>
  </table>

  <script>
    let players = JSON.parse(localStorage.getItem('soccer_players') || '[]');
    let editPlayerId = null;

    function addOrUpdatePlayer() {
      const input = document.getElementById('playerName');
      const name = input.value.trim();
      if (!name) return;

      if (editPlayerId !== null) {
        const player = players.find(p => p.id === editPlayerId);
        if (player) player.name = name;
        editPlayerId = null;
        document.getElementById('submitBtn').innerText = 'Add';
      } else {
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const newPlayer = {
          id: players.length + 1,
          name: name,
          time: timeStr,
          team: null,
          batchSeed: Math.random() // Seed to lock batch order
        };
        players.push(newPlayer);
      }

      recalculateTeams();
      saveAndRender();
      input.value = '';
    }

    function editPlayer(id) {
      const player = players.find(p => p.id === id);
      if (!player) return;

      document.getElementById('playerName').value = player.name;
      document.getElementById('playerName').focus();
      document.getElementById('submitBtn').innerText = 'Save';
      editPlayerId = id;
    }

    function deletePlayer(id) {
      if (!confirm("Are you sure you want to remove this player?")) return;
      
      players = players.filter(p => p.id !== id);

      // Re-index player IDs
      players.forEach((p, idx) => {
        p.id = idx + 1;
        p.team = null;
      });

      recalculateTeams();
      saveAndRender();
    }

    function resetSession() {
      if (confirm("Reset the entire session list? This cannot be undone.")) {
        players = [];
        localStorage.removeItem('soccer_players');
        saveAndRender();
      }
    }

    // Handles full batches of 3 AND partial groups (1 or 2 extra players)
    function recalculateTeams() {
      players.forEach(p => p.team = null);

      for (let i = 0; i < players.length; i += 3) {
        const batch = players.slice(i, i + 3);
        const sortedBatch = [...batch].sort((a, b) => a.batchSeed - b.batchSeed);

        if (batch.length === 3) {
          // Full batch of 3: assign randomly across A, B, C
          sortedBatch[0].team = 'A';
          sortedBatch[1].team = 'B';
          sortedBatch[2].team = 'C';
        } else if (batch.length === 1) {
          // 1 leftover player: pick a random team
          const available = ['A', 'B', 'C'].sort((a, b) => sortedBatch[0].batchSeed - 0.5);
          sortedBatch[0].team = available[0];
        } else if (batch.length === 2) {
          // 2 leftover players: pick 2 distinct random teams
          const available = ['A', 'B', 'C'].sort((a, b) => sortedBatch[0].batchSeed - 0.5);
          sortedBatch[0].team = available[0];
          sortedBatch[1].team = available[1];
        }
      }
    }

    function saveAndRender() {
      localStorage.setItem('soccer_players', JSON.stringify(players));

      // Render Arrival List
      const tbody = document.getElementById('arrivalTable');
      tbody.innerHTML = players.map(p => `
        <tr>
          <td>${p.id}</td>
          <td><strong>${p.name}</strong></td>
          <td>${p.time}</td>
          <td style="text-align: right;">
            <div class="action-btns" style="justify-content: flex-end;">
              <button class="btn-action" onclick="editPlayer(${p.id})">✏️</button>
              <button class="btn-action" onclick="deletePlayer(${p.id})">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');

      // Render Teams
      ['A', 'B', 'C'].forEach(team => {
        const container = document.getElementById(`team${team}`);
        const teamPlayers = players.filter(p => p.team === team);
        container.innerHTML = teamPlayers.map(p => `
          <div class="player-slot">
            <span>${p.name}</span>
            <span>#${p.id}</span>
          </div>
        `).join('');
      });
    }

    // Initial render
    saveAndRender();
  </script>
</body>
</html>
